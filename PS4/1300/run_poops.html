<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DZA - Poops Exploit</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at 50% 0%, rgba(0, 210, 255, .12), transparent 35%),
        linear-gradient(135deg, #05070b 0%, #0a1018 48%, #030507 100%);
    color: #e8faff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .25;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 35px 35px;
}

body::after {
    content: "";
    position: fixed;
    width: 420px;
    height: 420px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(0, 210, 255, .08);
    border-radius: 50%;
    box-shadow:
        0 0 0 50px rgba(0, 210, 255, .015),
        0 0 0 100px rgba(0, 210, 255, .01);
    pointer-events: none;
}

.container {
    position: relative;
    z-index: 2;
    width: min(92%, 720px);
    min-height: 470px;
    margin: 10vh auto 0;
    padding: 55px 55px 38px;
    background: rgba(7, 13, 20, .88);
    border: 1px solid rgba(0, 210, 255, .28);
    border-radius: 22px;
    box-shadow:
        0 0 45px rgba(0, 180, 255, .08),
        inset 0 0 50px rgba(0, 0, 0, .35);
    backdrop-filter: blur(14px);
}

header {
    text-align: center;
}

.main-title {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 13px;
    font-size: clamp(38px, 8vw, 64px);
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
}

.highlight {
    color: #ffffff;
    text-shadow: 0 0 22px rgba(255,255,255,.15);
}

.ps4-text {
    color: #00d9ff;
    text-shadow: 0 0 18px rgba(0,217,255,.55);
}

.subtitle {
    margin-top: 17px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #7293a4;
}

.version-badge {
    display: inline-block;
    margin-top: 22px;
    padding: 7px 15px;
    border: 1px solid rgba(0, 217, 255, .35);
    border-radius: 30px;
    color: #00d9ff;
    background: rgba(0, 217, 255, .055);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

.separator {
    height: 1px;
    margin: 42px 0 36px;
    border: 0;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 217, 255, .55),
        transparent
    );
}

#menu {
    text-align: center;
}

.fw-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c9e8f2;
}

.fw-range {
    margin-top: 12px;
    color: #637c89;
    font-size: 12px;
    letter-spacing: 1px;
}

.range-highlight {
    color: #00d9ff;
}

.status-bar {
    position: relative;
    margin: 32px auto 0;
    width: 100%;
    min-height: 62px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, .22);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 12px;
    overflow: hidden;
}

.status-bar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: 80px;
    height: 1px;
    transform: translateX(-50%);
    background: #00d9ff;
    opacity: .65;
}

.status-bar::after {
    content: "•••";
    position: absolute;
    bottom: 9px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    letter-spacing: 4px;
    color: #00d9ff;
    opacity: .3;
    animation: dots 1.4s ease-in-out infinite;
}

@keyframes dots {
    0% {
        opacity: .2;
        transform: translateX(-50%) translateY(0);
    }

    50% {
        opacity: .9;
        transform: translateX(-50%) translateY(-1px);
    }

    100% {
        opacity: .2;
        transform: translateX(-50%) translateY(0);
    }
}

.status-text {
    position: relative;
    z-index: 2;
    font-size: 13px;
    letter-spacing: .8px;
    color: #a9c4ce;
    transition:
        opacity .2s ease,
        color .2s ease;
}

.status-text.loading {
    animation: none;
}

.status-text.error {
    color: #ff6675;
    animation: none;
}

#out {
    display: none;
}

footer {
    margin-top: 38px;
}

.credit {
    font-size: 11px;
    color: #526b77;
}

.credit-link {
    color: #00d9ff;
    text-decoration: none;
}

.thanks {
    margin-top: 9px;
    font-size: 10px;
    color: #3e555f;
    letter-spacing: .4px;
}

@media (max-width: 600px) {

    .container {
        margin-top: 5vh;
        padding: 40px 22px 30px;
        min-height: 450px;
    }

    .main-title {
        gap: 7px;
        letter-spacing: -2px;
    }

    .subtitle {
        letter-spacing: 4px;
    }

    .separator {
        margin: 32px 0 28px;
    }
}

</style>
</head>

<body>

<div class="container">

    <header>

        <h1 class="main-title">
            <span class="highlight">DZA</span>
            <span class="ps4-text">GAMESTORE</span>
        </h1>

        <div class="subtitle">
            Pasar central lippo cikarang
        </div>
        <div class="subtitle">
            0878-7884-4020
        </div>

        <div class="version-badge">
            POOPS CHAIN
        </div>

    </header>

    <hr class="separator">

    <div id="menu">

        <h2 class="fw-title">
            Poops Exploit
        </h2>

        <p class="fw-range">
            Firmware
            <span class="range-highlight">
                12.50+
            </span>
        </p>

        <div class="status-bar">

            <span
                id="state"
                class="status-text loading"
            >
                ⏳ Harap tunggu...
            </span>

        </div>

        <div
            id="out"
            style="display:none;"
        ></div>

        <footer>

            <p class="credit">
                Special Thanks For All Developers Scene PS4
            </p>

            <p class="thanks"></p>

        </footer>

    </div>

</div>

<script type="module">

    // استيراد الثغرة
    import("./chain_poops.js").catch(function(e) {

        var stateEl =
            document.getElementById("state");

        stateEl.innerHTML =
            "❌ Gagal!";

        stateEl.className =
            "status-text error";

    });

</script>

</body>
</html>
